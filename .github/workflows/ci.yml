name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar exposição de segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Verificar qualidade do código
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Subir banco de dados
        run: docker compose up -d database --wait
        env:
          POSTGRES_USER: gtech
          POSTGRES_PASSWORD: gtech
          POSTGRES_DB: gtech
          APP_DB_USER: gtech_app
          APP_DB_PASSWORD: gtech_app

      - name: Aplicar migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: postgresql://gtech:gtech@localhost:5432/gtech?schema=public

      - name: Executar testes
        run: npm run test:coverage
        env:
          PORT: "3000"
          DATABASE_URL: postgresql://gtech_app:gtech_app@localhost:5432/gtech?schema=public

      - name: Relatório de cobertura como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Construir imagem
        run: docker build -t projeto-gtech:ci .

      - name: Escanear vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: projeto-gtech:ci
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
